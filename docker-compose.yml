services:
  web:
    build: .
    ports:
      - "9090:8080"    # Access at http://localhost (port 80 = no port needed in URL)
    volumes:
      - aso_data:/app/data
    restart: unless-stopped
    environment:
      - SECRET_KEY=${SECRET_KEY:-}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-}

volumes:
  aso_data:
